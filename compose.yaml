services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=stockscope'
      - 'POSTGRES_USER=stockscope'
      - 'POSTGRES_PASSWORD=stockscope'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockscope -d stockscope']
      interval: 5s
      timeout: 3s
      retries: 10
